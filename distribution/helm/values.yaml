global:
  image: harbor.icecube.aq/wipac/i3_ray_serve
  imageTag: v0.3.1-alpha
  cvmfs: persistentVolume
  rayVersion: 2.52.0
  hostname: i3ray.nrp-nautilus.io
ingress:
  enable: true
  ingressClassName: haproxy
  rayMetrics:
    path: /metrics
    port: 8080
    enable: true
  issuer:
    enable: false
    issuerEmail: "admin@icecube.wisc.edu"
    issuerSecretName: issuer-account-key
gatewayAPI:
  enable: false
fluentBit:
  imageTag: 3.2.2
  output: victorialogs
serveConfig:
  applications:
    - name: i3_ray_serve
      route_prefix: /
      import_path: server:model
      deployments:
        - name: TglauchClassifier
          ray_actor_options:
            num_gpus: 1
            runtime_env:
              env_vars:
                LD_LIBRARY_PATH: ${LD_LIBRARY_PATH}:/home/ray/anaconda3/lib
          max_ongoing_requests: 100
          autoscaling_config:
            target_ongoing_requests: 2
            min_replicas: 5
            max_replicas: 60
env:
  LOG_LEVEL: INFO
  AUTH_AUDIENCE: ray-serve
  AUTH_OPENID_URL: https://keycloak.icecube.wisc.edu/auth/realms/IceCube
  MODEL_NAME: tglauch_classifier
  MODEL_VERSION: "3"
  MODEL_REPO: /cvmfs/icecube.opensciencegrid.org/users/briedel/ml/models
  MAX_BATCH_SIZE: 250
  BATCH_WAIT_TIMEOUT_S: 0.001
volumeMounts:
  - name: cvmfs-volume
    mountPath: /cvmfs/icecube.opensciencegrid.org
    mountPropagation: HostToContainer
    subPath: icecube.opensciencegrid.org
headGroupResources:
  limits:
    cpu: "3"
    memory: "8Gi"
  requests:
    cpu: "1"
    memory: "5G"
workerGroupResources:
  limits:
    cpu: "12"
    memory: "30Gi"
    nvidia.com/gpu: 1
  requests:
    cpu: "10"
    memory: "15Gi"
    nvidia.com/gpu: 1
scaling:
  podReplicas: 0
  minPodReplicas: 0
  maxPodReplicas: 5
metrics:
  podMonitors:
    enable: false
