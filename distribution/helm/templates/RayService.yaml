{{- if not .Values.global.clusterOnly }}
apiVersion: ray.io/v1
kind: RayService
metadata:
  annotations:
    ray.io/initializing-timeout:  {{ .Values.global.initializingTimeout }}
  name: {{ .Release.Name }}-serve
  namespace: {{ .Release.Namespace }}
spec:
  serveConfigV2: |
    {{- toYaml .Values.serveConfig | nindent 4 }}
  serveService:
    metadata:
      name: {{ .Release.Name }}-serve
    spec:
      type: ClusterIP
      ports:
        - appProtocol: tcp
          name: serve
          port: 8000
          protocol: TCP
          targetPort: 8000
  rayClusterConfig:
    rayVersion: {{ .Values.global.rayVersion }}
    enableInTreeAutoscaling: true
    autoscalerOptions:
      upscalingMode: Default
      idleTimeoutSeconds: 60
      env:
        - name: AUTOSCALER_UPDATE_INTERVAL_S
          value: "5"
    headGroupSpec:
      rayStartParams:
        num-cpus: "0"
        num-gpus: "0"
      template:
        spec:
          containers:
          - name: ray-head
            image: {{ print .Values.global.image ":" .Values.global.imageTag }}
            env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key | quote }}
              value: {{ $value | quote }}
            {{- end }}
            imagePullPolicy: Always
            resources: {{ toYaml .Values.headGroup.resources | nindent 14 }}
            volumeMounts: 
            {{- toYaml .Values.volumeMounts | nindent 12 }}
            - name: ray-tmp
              mountPath: /tmp/ray
          - name: fluentbit
            image: {{ print "fluent/fluent-bit:" .Values.fluentBit.imageTag }}
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 100m
                memory: 128Mi
            volumeMounts:
            - mountPath: /tmp/ray
              name: ray-tmp
            - mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              name: fluentbit-config
          {{- if .Values.metrics.localPrometheus.enable }}
          - {{- include "prometheusContainer" . | nindent 14 }}
          {{- end }}
          imagePullSecrets:
          - name: harbor-registry
          volumes:
          - name: cvmfs-volume
            {{- if eq .Values.global.cvmfs "persistentVolume" }}
            {{- include "cvmfsPersistentVolume" . | indent 12 }}
            {{- else if eq .Values.global.cvmfs "hostPath" }}
            {{- include "cvmfsHostPath" . | nindent 12 }}
            {{- end }}
          - name: ray-tmp
            emptyDir: {}
          - name: fluentbit-config
            configMap:
              name: fluentbit-config
          {{- if .Values.metrics.localPrometheus.enable }}
          - {{- include "prometheusConfigVolume" . | indent 12 }}
          {{- end }}
    workerGroupSpecs:
    - replicas: {{ .Values.workerGroup.scaling.podReplicas }}
      minReplicas: {{ .Values.workerGroup.scaling.minPodReplicas }}
      maxReplicas: {{ .Values.workerGroup.scaling.maxPodReplicas }}
      groupName: tasks
      rayStartParams: {}
      template:
        spec:
          {{- if .Values.workerGroup.affinity }}
          affinity:
            {{- toYaml .Values.workerGroup.affinity | nindent 12 }}
          {{- end }}
          containers:
          - name: ray-worker
            image: {{ print .Values.global.image ":" .Values.global.imageTag }}
            env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key | quote }}
              value: {{ $value | quote }}
            {{- end }}              
            imagePullPolicy: Always
            resources: {{ toYaml .Values.workerGroup.resources | nindent 14 }}
            volumeMounts: 
            {{- toYaml .Values.volumeMounts | nindent 12 }}
          imagePullSecrets:
          - name: harbor-registry
          volumes:
          - name: cvmfs-volume
            {{- if eq .Values.global.cvmfs "persistentVolume" }}
            {{- include "cvmfsPersistentVolume" . | indent 12 }}
            {{- else if eq .Values.global.cvmfs "hostPath" }}
            {{- include "cvmfsHostPath" . | indent 12 }}
            {{- end }}
{{- end }}
