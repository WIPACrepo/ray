{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-dashboard
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if ne .Values.ingress.ingressClassName "haproxy" }}
    cert-manager.io/cluster-issuer: "letsencrypt-dns01-prod"
    {{- end }}
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  tls:
    - hosts:
      - {{ .Values.global.hostname }}
      secretName: i3ray-tls
  rules:
    - host: {{ .Values.global.hostname }}
      http:
        paths:
          - backend:
              service:
                name: {{ .Release.name }}-serve-head-svc
                port:
                  number: 8265
            path: /dashboard(/|$)(.*)
            pathType: ImplementationSpecific
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-inference
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if ne .Values.ingress.ingressClassName "haproxy" }}
    cert-manager.io/cluster-issuer: "letsencrypt-dns01-prod"
    {{- end }}
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  tls:
    - hosts:
      - {{ .Values.global.hostname }}
      secretName: i3ray-tls
  rules:
    - host: {{ .Values.global.hostname }}
      http:
        paths:
          - backend:
              service:
                name: {{ .Release.name }}-serve-head-svc
                port:
                  number: 8000
            path: /
            pathType: ImplementationSpecific
{{- end }}
